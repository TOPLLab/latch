name: Tests
on: [ push ]

jobs:
  build-wabt:
    name: Build WAT tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get WABT commit ID
        working-directory: tests/artifacts/wabt
        run: echo "WABT_VERSION=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Cache wabt
        uses: actions/cache@v4
        id: cache-wabt
        with:
          key: ${{ runner.os }}-wabt-${{ env.WABT_VERSION }}
          path: tests/artifacts/wabt
          restore-keys: |
            ${{ runner.os }}-wabt-

      - name: Build WABT  # Build latest version
        if: steps.cache-wabt.outputs.cache-hit == false
        working-directory: tests/artifacts/wabt
        run: |
          mkdir build; cd build
          cmake ..
          cmake --build .

      - name: Upload built tools
        uses: actions/upload-artifact@v4
        with:
          name: wabt-build-${{ github.run_id }}
          path: tests/artifacts/wabt/build

  build-wdcli:
    name: Build WARDuino CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WARDuino CLI
        uses: ./.github/actions/build-warduino
        with:
          version: 0.8.1

      - name: Upload built tools
        uses: actions/upload-artifact@v4
        with:
          name: warduino-build-${{ github.run_id }}
          path: tests/artifacts/warduino/build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [build-wabt, build-wdcli]
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - run: npm i

      - name: Prebuild files
        run: npm run test:prebuild

      - name: Download WAT tools
        uses: actions/download-artifact@v4
        with:
          name: wabt-build-${{ github.run_id }}
          path: .tools

      - name: Download WARDuino CLI
        uses: actions/download-artifact@v4
        with:
          name: warduino-build-${{ github.run_id }}
          path: .warduino

      - name: Verify tools
        run: |
          chmod u+x "$GITHUB_WORKSPACE"/.tools/*
          "$GITHUB_WORKSPACE"/.tools/wasm-objdump --version
          find "$GITHUB_WORKSPACE"/.warduino -type f -name wdcli -exec chmod u+x {} \;
          EMULATOR_PATH="$(find "$GITHUB_WORKSPACE"/.warduino -type f -name wdcli -print -quit)"
          test -n "$EMULATOR_PATH"
          echo "EMULATOR=$EMULATOR_PATH" >> $GITHUB_ENV

      - name: Run ava unit tests
        run: npm run test:ava
        env:
          WABT: ${{ github.workspace }}/.tools

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [build-wabt, build-wdcli]
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - run: npm i

      - name: Prebuild files
        run: npm run test:prebuild

      - name: Download WAT tools
        uses: actions/download-artifact@v4
        with:
          name: wabt-build-${{ github.run_id }}
          path: .tools

      - name: Download WARDuino CLI
        uses: actions/download-artifact@v4
        with:
          name: warduino-build-${{ github.run_id }}
          path: .warduino

      - name: Configure test tools
        run: |
          chmod u+x "$GITHUB_WORKSPACE"/.tools/*
          "$GITHUB_WORKSPACE"/.tools/wat2wasm --version
          EMULATOR_PATH="$(find "$GITHUB_WORKSPACE"/.warduino -type f -name wdcli -print -quit)"
          test -n "$EMULATOR_PATH"
          chmod u+x "$EMULATOR_PATH"
          echo "EMULATOR=$EMULATOR_PATH" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: npm run test:integration
        env:
          WABT: ${{ github.workspace }}/.tools

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: build-wdcli
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - run: npm i

      - name: Prebuild files
        run: npm run test:prebuild

      - name: Download WARDuino CLI
        uses: actions/download-artifact@v4
        with:
          name: warduino-build-${{ github.run_id }}
          path: .warduino

      - name: Configure emulator
        run: |
          EMULATOR_PATH="$(find "$GITHUB_WORKSPACE"/.warduino -type f -name wdcli -print -quit)"
          test -n "$EMULATOR_PATH"
          chmod u+x "$EMULATOR_PATH"
          echo "EMULATOR=$EMULATOR_PATH" >> "$GITHUB_ENV"

      - name: Run end-to-end tests
        run: npm run test:end-to-end

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: build-wabt
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - run: npm i

      - name: Prebuild files
        run: npm run test:prebuild

      - name: Download WAT tools
        uses: actions/download-artifact@v4
        with:
          name: wabt-build-${{ github.run_id }}
          path: .tools

      - name: Verify tools
        run: |
          chmod u+x $GITHUB_WORKSPACE/.tools/*
          $GITHUB_WORKSPACE/.tools/wasm-objdump --version

      - name: Add .tools to PATH
        run: echo "$GITHUB_WORKSPACE/.tools" >> $GITHUB_PATH

      - name: Run c8 coverage
        run: |
          echo "LINE_COVERAGE=$(npm run coverage:test:ava | grep -E 'Lines\s*:\s*[0-9]+(\.[0-9]+)?%' | awk '{print $3}' | tr -d '%')" >> $GITHUB_ENV

      - name: Report coverage
        run: npx c8 report --all

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 615b7906cd71effb447c4b08673d2cb6
          filename: latch-coverage.json
          label: Coverage
          message: ${{ env.LINE_COVERAGE }}
          valColorRange: ${{ env.LINE_COVERAGE }}
          maxColorRange: 100
          minColorRange: 0
